services:
  - type: web
    name: ai-ppt-maker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-3.1-flash
      - key: OPENAI_TEXT_MODEL
        value: gpt-5
      - key: ANTHROPIC_TEXT_MODEL
        value: claude-sonnet-4-5
      - key: GEMINI_IMAGE_MODEL
        value: gemini-3.1-flash-image
